modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
displayURL = "${mod_url}"
logoFile = "icon.png"
# credits="Thanks to Mojang for making this great game"
authors = "${mod_author}"
description = '''
GregTech addon for FlatTech
'''

[[dependencies.${ mod_id }]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
